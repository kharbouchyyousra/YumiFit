<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard — Admin</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/admin.css">
  <script src="/socket.io/socket.io.js"></script>

</head>
<body>
  <div class="admin-layout">
    <aside class="sidebar">
      <h2>Yumi<span>Fit</span></h2>
      <nav>
        <a href="dashboard.html" class="active">📊 <span>Dashboard</span></a>
        <a href="commandes.html">📦 <span>Commandes</span></a>
        <a href="produits.html">🛍️ <span>Sweets healthy</span></a>
        <a href="clients.html">👥 <span>Clients</span></a>
        <a href="#" class="logout" onclick="logout()">🚪 <span>Déconnexion</span></a>
      </nav>
    </aside>

    <main class="main-content">
      <div class="topbar">
        <h1>Dashboard</h1>
        <div class="admin-user">👤 Admin</div>
        <button class="btn-sm btn-view" onclick="exportCsv()">📥 Export CSV</button>
      </div>

      <div class="stats-grid">
        <div class="stat-card">
          <div class="value" id="stat-commandes">0</div>
          <div class="label">Commandes</div>
        </div>
        <div class="stat-card products">
          <div class="value" id="stat-produits">0</div>
          <div class="label">Produits</div>
        </div>
        <div class="stat-card clients">
          <div class="value" id="stat-clients">0</div>
          <div class="label">Clients</div>
        </div>
        <div class="stat-card pending">
          <div class="value" id="stat-pending">0</div>
          <div class="label">En attente</div>
        </div>
      </div>

      <div class="table-card">
        <h3>Commandes récentes</h3>
        <table>
          <thead>
            <tr>
              <th>N°</th><th>Client</th><th>Téléphone</th>
              <th>Total</th><th>Statut</th><th>Actions</th>
            </tr>
          </thead>
          <tbody id="recent-orders"></tbody>
        </table>
      </div>
    </main>
  </div>
<script src="js/admin.js"></script>
<script>
  requireAuth();
  renderDashboard();
  initSocket();      // 🔔 temps réel
</script>
</body>
</html>
