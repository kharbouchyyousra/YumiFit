<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact — YumiFit</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="header-placeholder"></div>

  <section class="container">
    <h2 class="section-title">Contactez-nous</h2>

    <div class="contact-grid">
      <div class="contact-info">
        <h3>Nos coordonnées</h3>
        <div class="contact-item">
          <div class="icon">📞</div>
          <div><strong>Téléphone</strong><br>06 XX XX XX XX</div>
        </div>
        <div class="contact-item">
          <div class="icon">📧</div>
          <div><strong>Email</strong><br>kharbouchyyousra@gmail.com</div>
        </div>
        <div class="contact-item">
          <div class="icon">📍</div>
          <div><strong>Adresse</strong><br>mohammedia, Maroc</div>
        </div>
        <div class="social-links">
          <a href="#">Instagram</a>
          <a href="#">Facebook</a>
        </div>
      </div>

      <form class="form-card" id="contact-form" style="margin:0;max-width:100%">
        <h3 style="margin-bottom:20px">Envoyez-nous un message</h3>
        <div class="form-group">
          <label for="c-nom">Nom</label>
          <input type="text" id="c-nom" required>
        </div>
        <div class="form-group">
          <label for="c-email">Email</label>
          <input type="email" id="c-email" required>
        </div>
        <div class="form-group">
          <label for="c-message">Message</label>
          <textarea id="c-message" required></textarea>
        </div>
        <button type="submit" class="btn btn-block">Envoyer</button>
      </form>
    </div>
  </section>

  <div id="footer-placeholder"></div>
  <script src="js/script.js"></script>
</body>
</html>
