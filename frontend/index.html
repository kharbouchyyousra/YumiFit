<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>YumiFit — Accueil</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="header-placeholder"></div>

  <section class="hero">
  <img src="images/logo.jpeg" alt="YumiFit" style="height:140px;width:auto;margin-bottom:20px;border-radius:50%">
  <h1>Bienvenue chez <span style="color:#7A8B4F">YumiFit</span></h1>
  <p>Healthy Sweets — Le plaisir sain au quotidien 🌿</p>
  <a href="produits.html" class="btn">Découvrir nos produits</a>
</section>

  <section class="container">
    <h2 class="section-title">Nos Sweets Healthy</h2>
    <div class="products-grid" id="products-grid"></div>
  </section>

  <div id="footer-placeholder"></div>
  <script src="js/script.js"></script>
  <script>
    // Limiter à 4 produits sur l'accueil
    document.addEventListener('DOMContentLoaded', () => {
      setTimeout(() => {
        const grid = document.getElementById('products-grid');
        if (grid && grid.children.length > 4) {
          [...grid.children].slice(4).forEach(el => el.remove());
        }
      }, 50);
    });
  </script>
</body>
</html>
